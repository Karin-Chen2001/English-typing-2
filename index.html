<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英打遊戲版本二</title>
<style>
  body { margin: 0; min-height: 100vh; background: #fff; color: #222; text-align: center;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; padding: 1rem;
         font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  h1 { font-size: 2.2rem; margin: 0; }
  img { max-width: min(90vw, 700px); height: auto; border-radius: 12px; }
  button { font: inherit; font-size: 1.2rem; padding: .6rem 2rem; cursor: pointer; }
  #msg { min-height: 1.5em; color: #b42318; }
</style>
</head>
<body>
  <h1>英打遊戲版本二</h1>
  <img id="kb" src="assets/keyboard.png" alt="英文鍵盤示意圖">
  <button id="start" type="button">開始</button>
  <p id="msg" role="status"></p>
  <script>
    const msg = document.getElementById("msg");
    document.getElementById("kb").addEventListener("error", () => {
      msg.textContent = "找不到鍵盤圖片：請確認 assets/keyboard.png 已一起上傳。";
    });
    document.getElementById("start").addEventListener("click", () => {
      msg.textContent = "";
      const beep = new Audio("assets/beep.wav");
      beep.play().catch(() => {
        msg.textContent = "無法播放聲音：請確認 assets/beep.wav 存在，並檢查音量與靜音設定。";
      });
    });
  </script>
</body>
</html>
